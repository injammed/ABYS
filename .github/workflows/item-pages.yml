name: Deploy ITEM Museum / Slop Trough

on:
  push:
    branches: [main]
    paths:
      - "apps/item-web/**"
      - ".github/workflows/item-pages.yml"
  workflow_dispatch:
    inputs:
      site_mode:
        description: "Choose custom-domain-root after aetimm.com is configured in Pages"
        required: true
        default: auto
        type: choice
        options:
          - auto
          - custom-domain-root

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: item-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          static_site_generator: next

      - name: Resolve Pages base path
        id: base
        shell: bash
        env:
          CONFIGURED_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          SITE_MODE: ${{ inputs.site_mode || 'auto' }}
        run: |
          if [ "$SITE_MODE" = "custom-domain-root" ]; then
            echo "value=" >> "$GITHUB_OUTPUT"
          else
            echo "value=$CONFIGURED_BASE_PATH" >> "$GITHUB_OUTPUT"
          fi

      - name: Install
        working-directory: apps/item-web
        run: npm install

      - name: Verify permanent feed-first root
        working-directory: apps/item-web
        run: npm run verify:feed-root

      - name: Verify Feed / Museum route duality
        working-directory: apps/item-web
        run: npm run verify:mode-duality

      - name: Verify primary 50/50 mode switch
        working-directory: apps/item-web
        run: npm run verify:mode-switch

      - name: Verify curator migration contract
        working-directory: apps/item-web
        run: npm run verify:curator

      - name: Verify composite feed cursor
        working-directory: apps/item-web
        run: npm run verify:feed-cursor

      - name: Typecheck
        working-directory: apps/item-web
        run: npm run typecheck

      - name: Build static PWA
        working-directory: apps/item-web
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.base.outputs.value }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: apps/item-web/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
