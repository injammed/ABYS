name: ITEM Feed Preview

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy preview to Vercel when secrets are configured"
        required: true
        default: true
        type: boolean
  pull_request:
    paths:
      - "apps/item-web/**"
      - ".github/workflows/item-feed-preview.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/item-web
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/item-web/package-lock.json

      - name: Install
        run: npm install --package-lock-only && npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Deploy Vercel preview
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy && env.VERCEL_TOKEN != '' }}
        run: |
          npm install --global vercel@latest
          vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"
          vercel build --token="$VERCEL_TOKEN"
          vercel deploy --prebuilt --token="$VERCEL_TOKEN" | tee deployment-url.txt

      - name: Upload deployment URL
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy && env.VERCEL_TOKEN != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: item-preview-url
          path: apps/item-web/deployment-url.txt
