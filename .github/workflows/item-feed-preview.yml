name: ITEM Feed Preview

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy preview to Vercel when secrets are configured"
        required: true
        default: true
        type: boolean
  pull_request:
    paths:
      - "apps/item-web/**"
      - "supabase/migrations/**"
      - ".github/workflows/item-feed-preview.yml"
  push:
    branches:
      - "fold/**"
      - "feature/**"
      - "fix/**"
      - "security/**"
    paths:
      - "apps/item-web/**"
      - "supabase/migrations/**"
      - ".github/workflows/item-feed-preview.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/item-web
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install

      - name: Verify permanent feed-first root
        run: npm run verify:feed-root

      - name: Verify Feed / Museum route duality
        run: npm run verify:mode-duality

      - name: Verify primary 50/50 mode switch
        run: npm run verify:mode-switch

      - name: Verify Caechat selection rehearsal
        run: npm run verify:selection-rehearsal

      - name: Verify curator migration contract
        run: npm run verify:curator

      - name: Verify composite feed cursor
        run: npm run verify:feed-cursor

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Deploy Vercel preview
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy && env.VERCEL_TOKEN != '' }}
        run: |
          npm install --global vercel@latest
          vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"
          vercel build --token="$VERCEL_TOKEN"
          vercel deploy --prebuilt --token="$VERCEL_TOKEN" | tee deployment-url.txt

      - name: Upload deployment URL
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy && env.VERCEL_TOKEN != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: item-preview-url
          path: apps/item-web/deployment-url.txt
