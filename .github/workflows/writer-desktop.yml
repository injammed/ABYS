name: Build AETIMM Writer desktop installers
on:
  push:
    branches: [main]
    paths: ['apps/aetimm-writer/**', 'apps/item-web/public/writer/**', '.github/workflows/writer-desktop.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: writer-desktop
  cancel-in-progress: false
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win --x64
            label: Windows
          - os: macos-latest
            target: --mac --arm64 --x64
            label: macOS
          - os: ubuntu-latest
            target: --linux --x64
            label: Linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/aetimm-writer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run check && npm test && npm run prepare-editor
      - name: Real Chromium writing smoke test
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run smoke -- --no-sandbox
      - name: Verify generated Word document
        if: runner.os == 'Linux'
        run: python -c "import zipfile,xml.etree.ElementTree as E; z=zipfile.ZipFile('smoke-output.docx'); assert z.testzip() is None; [E.fromstring(z.read(n)) for n in z.namelist()]; print('Word XML / CRC validation PASS')"
      - name: Build installable desktop app
        run: npm run dist -- ${{ matrix.target }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: writer-${{ matrix.label }}
          path: |
            apps/aetimm-writer/dist/*.exe
            apps/aetimm-writer/dist/*.dmg
            apps/aetimm-writer/dist/*.AppImage
          if-no-files-found: error
  release:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: writer-*
          path: installers
          merge-multiple: true
      - name: Publish laptop downloads
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="writer-v$(node -p "require('./apps/aetimm-writer/package.json').version")"
          find installers -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > installers/SHA256SUMS.txt
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "This version already exists. Increment the app version before publishing." >&2
            exit 1
          fi
          gh release create "$TAG" installers/* --target "$GITHUB_SHA" --title "AETIMM Writer $(node -p "require('./apps/aetimm-writer/package.json').version")" --notes-file apps/aetimm-writer/RELEASE.md --latest=false
