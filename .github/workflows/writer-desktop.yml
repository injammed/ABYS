name: Build vnnova desktop installers
on:
  push:
    branches: [main]
    paths: ['apps/aetimm-writer/**', 'apps/item-web/public/writer/**', '.github/workflows/writer-desktop.yml']
  pull_request:
    paths: ['apps/aetimm-writer/**', 'apps/item-web/public/writer/**', '.github/workflows/writer-desktop.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: writer-desktop-${{ github.ref }}
  cancel-in-progress: false
jobs:
  editor-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/aetimm-writer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run check && npm test && npm run prepare-editor
      - run: xvfb-run -a npm run smoke -- --no-sandbox
      - name: Verify Word symbols and XML
        run: python -c "import zipfile,xml.etree.ElementTree as E; z=zipfile.ZipFile('smoke-output.docx'); assert z.testzip() is None; [E.fromstring(z.read(n)) for n in z.namelist() if n.endswith(('.xml', '.rels'))]; assert len([n for n in z.namelist() if n.endswith('.png')]) == 2; print('Word images / XML / CRC PASS')"
  package:
    if: github.event_name != 'pull_request'
    needs: editor-smoke
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win --x64
            label: Windows
          - os: macos-latest
            target: --mac --arm64 --x64
            label: macOS
          - os: ubuntu-latest
            target: --linux --x64
            label: Linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/aetimm-writer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run check && npm test && npm run prepare-editor
      - name: Build installable desktop app
        run: npm run dist -- ${{ matrix.target }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: writer-${{ matrix.label }}
          path: |
            apps/aetimm-writer/dist/*.exe
            apps/aetimm-writer/dist/*.dmg
            apps/aetimm-writer/dist/*.AppImage
          if-no-files-found: error
  release:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: writer-*
          path: installers
          merge-multiple: true
      - name: Publish laptop downloads
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="$(node -p "require('./apps/aetimm-writer/package.json').version")"
          for FILE in "Windows-x64.exe" "macOS-arm64.dmg" "macOS-x64.dmg" "Linux-x86_64.AppImage"; do
            test -s "installers/vnnova-$VERSION-$FILE"
          done
          TAG="writer-v$(node -p "require('./apps/aetimm-writer/package.json').version")"
          (cd installers && sha256sum vnnova-*) > installers/SHA256SUMS.txt
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "This version already exists. Increment the app version before publishing." >&2
            exit 1
          fi
          gh release create "$TAG" installers/* --target "$GITHUB_SHA" --title "vnnova $(node -p "require('./apps/aetimm-writer/package.json').version")" --notes-file apps/aetimm-writer/RELEASE.md --latest=false
